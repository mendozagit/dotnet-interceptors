name: CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NuGet'
        required: true
        default: false
        type: boolean
      version_suffix:
        description: 'Version suffix (e.g., beta, rc1). Leave empty for release.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore DotnetInterceptors.csproj

      - name: Extract Package Version
        id: get_version
        run: |
          version=$(grep -oPm1 "(?<=<Version>)[^<]+" ./DotnetInterceptors.csproj)
          echo "PACKAGE_VERSION=$version" >> $GITHUB_ENV
          echo "Package Version: $version"

      - name: Build
        run: dotnet build DotnetInterceptors.csproj --configuration Release --no-restore

      - name: Pack NuGet Package
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        run: |
          if [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            dotnet pack DotnetInterceptors.csproj --configuration Release --no-build --output ./nupkg --version-suffix "${{ github.event.inputs.version_suffix }}"
          else
            dotnet pack DotnetInterceptors.csproj --configuration Release --no-build --output ./nupkg
          fi

      - name: Publish to NuGet
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key $NUGET_KEY \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
